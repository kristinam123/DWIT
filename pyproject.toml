[tool.deptry]
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "droplet-wall-interaction-tool"
version = "1.2.5"
description = "Research-oriented platform for qualitative image analysis of droplet experiments"
readme = "readme.md"
requires-python = ">=3.10"
license = {text = "EPL-2.0"}
authors = [
    {name = "Kristina Mielke", email = ""},
    {name = "Arif Rasim Can", email = ""},
]
keywords = [
    "image-analysis",
    "droplet-experiments",
    "contact-angle",
    "laboratory-automation",
    "scientific-software",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Eclipse Public License 2.0 (EPL-2.0)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "PySide6>=6.0.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scipy>=1.7.0",
    "opencv-python>=4.5.0",
]

[project.urls]
Homepage = "https://github.com/kristinam123/DWIT.git"
Repository = "https://github.com/kristinam123/DWIT.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
# Optional: same as black's line length
line-length = 88
fix = true
src = ["src"]

[tool.ruff.lint]
# Enable rules for isort, pydocstyle, etc.
select = [
 "E", "F", "I", "D", "N",       # animg
 "UP", "SIM",                   # upgrades and simplifications
 "C90",                         # mccabe complexity
 "RUF"]                         # Ruff-specific rules
ignore = ["SIM105"]

[tool.ruff.lint.mccabe]
# Set max complexity slightly higher to accommodate orchestration methods
max-complexity = 12

[tool.ruff.format]
# Enable black-style formatting
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
